data:
  path: data/processed/ecog_trials.npz   # (N, E, T) + labels

model:
  latent_dim: 128      # d
  content_dim: 32      # k, doit rester < d
  hidden_dim: 256
  n_layers: 3
  proj_dim: 64         # dimension des projections q/k du TWM

loss:
  lambda_cal: 1.0      # poids de L_cal
  beta_warp: 0.1       # poids de Omega(A)
  contrastive: false   # true -> InfoNCE au lieu de la L2

train:
  epochs: 100
  batch_size: 32
  lr: 0.0003
  num_workers: 2
  seed: 0
